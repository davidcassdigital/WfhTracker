<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WFH Tracker</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/output.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app" class="flex flex-col items-center justify-center min-h-screen bg-zinc-950">
        <div class="relative w-24 h-24 mb-4">
            <!-- Rotating border circle -->
            <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-amber-600 border-r-amber-600 animate-spin"></div>

            <!-- Logo in center -->
            <div class="absolute inset-0 flex items-center justify-center">
                <img src="images/logo.png" alt="Loading" class="w-16 h-16" />
            </div>
        </div>

        <div class="text-zinc-400 text-sm">Loading</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
