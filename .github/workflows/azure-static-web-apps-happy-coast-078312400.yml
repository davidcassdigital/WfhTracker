name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/WfhTracker.Client/WfhTracker.Client.csproj

      - name: Publish
        run: dotnet publish src/WfhTracker.Client/WfhTracker.Client.csproj -c Release

      - name: Check deployment token
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}" ]; then
            echo "Token is missing"
            exit 1
          else
            echo "Token is present"
          fi
          
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          action: upload

          skip_app_build: true

          app_location: "src/WfhTracker.Client"
          app_artifact_location: "src/WfhTracker.Client/bin/Release/net8.0/browser-wasm/publish/wwwroot"
          
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
